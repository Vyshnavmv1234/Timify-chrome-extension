<span id="tooltip-text"></span>

</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const bars = document.querySelectorAll('rect[data-tooltip]');
        const tooltip = document.getElementById('chart-tooltip');
        const tooltipText = document.getElementById('tooltip-text');

        bars.forEach(bar => {
            bar.addEventListener('mouseenter', (e) => {
                const rect = e.target.getBoundingClientRect();
                const containerRect = e.target.closest('svg').getBoundingClientRect();
                
                tooltipText.textContent = e.target.getAttribute('data-tooltip');
                
                
                const left = rect.left - containerRect.left + (rect.width / 2);
                const top = rect.top - containerRect.top;

                tooltip.style.left = `${left}px`;
                tooltip.style.top = `${top}px`;
                
                tooltip.classList.remove('hidden');
                
                setTimeout(() => tooltip.classList.remove('opacity-0'), 10);
            });

            bar.addEventListener('mouseleave', () => {
                tooltip.classList.add('opacity-0');
                setTimeout(() => tooltip.classList.add('hidden'), 150); 
            });
        });
    });
</script></div></main></div></body></html>
