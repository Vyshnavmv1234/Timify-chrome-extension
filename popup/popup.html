<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timify</title>
  <!--
    popup.html
    Default toolbar popup for the Timify extension.
    Provides quick access to timer controls, tasks, and dashboard link.
  -->
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="popup__header">
      <h1 class="popup__title">Timify</h1>
      <p class="popup__subtitle text-muted">Stay focused</p>
    </header>

    <main class="popup__main">
      <section class="popup__section card" id="timer-section">
        <h2 class="popup__section-title">Timer</h2>
        <p class="popup__timer-display" id="timer-display">25:00</p>
        <div class="popup__timer-actions">
          <button class="btn btn--primary" id="btn-start" type="button">Start</button>
          <button class="btn btn--secondary" id="btn-pause" type="button" disabled>Pause</button>
          <button class="btn btn--secondary" id="btn-stop" type="button" disabled>Stop</button>
        </div>
      </section>

      <section class="popup__section card" id="tasks-section">
        <h2 class="popup__section-title">Tasks</h2>
        <ul class="popup__task-list" id="task-list">
          <li class="popup__task-item text-muted">No tasks yet</li>
        </ul>
      </section>

      <section class="popup__section popup__quick-actions">
        <a class="btn btn--secondary popup__dashboard-link" id="dashboard-link" href="#">
          Open Dashboard
        </a>
      </section>
    </main>

    <footer class="popup__footer">
      <p class="text-sm text-muted" id="quote-display">Loading quote...</p>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
