<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timify</title>
  <!--
    popup.html
    Quick Control Center — Timer, Current Session, Today's Progress, Quick Actions.
    Full dashboard and settings open in separate browser tabs.
  -->
  <link rel="stylesheet" href="../styles/global.css">
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="views.css">
</head>
<body>
  <div class="app">

    <main class="app__content">

      <!-- ==================== HOME (Control Center) ==================== -->
      <section id="view-home" class="view is-active" aria-label="Quick Control Center">

        <!-- Greeting -->
        <div class="home-greeting">
          <p class="home-greeting__time">Good Morning,</p>
          <h1 class="home-greeting__name">Student</h1>
        </div>

        <!-- Streak + Goal Row -->
        <div class="home-row">
          <div class="card home-streak">
            <span class="home-streak__emoji" aria-hidden="true">🔥</span>
            <div>
              <p class="home-streak__count">0</p>
              <p class="home-streak__label">Day Streak</p>
            </div>
          </div>

          <div class="card home-goal">
            <div class="home-goal__info">
              <p class="home-goal__title">8 Hours</p>
              <p class="home-goal__subtitle">Today's Goal</p>
            </div>
            <div class="progress-ring" aria-label="Daily goal progress">
              <svg class="progress-ring__svg" viewBox="0 0 72 72">
                <circle class="progress-ring__bg" cx="36" cy="36" r="30"/>
                <circle class="progress-ring__fill" cx="36" cy="36" r="30"/>
              </svg>
              <span class="progress-ring__label">0%</span>
            </div>
          </div>
        </div>

        <!-- Today's Progress -->
        <p class="section-label">Today's Progress</p>

        <div class="card" style="padding: var(--spacing-md);">
          <div class="stat-grid">
            <div class="stat-item">
              <span class="stat-item__value" id="stat-study-time">0m</span>
              <span class="stat-item__label">Study Time</span>
            </div>
            <div class="stat-item">
              <span class="stat-item__value" id="stat-sessions">0</span>
              <span class="stat-item__label">Sessions</span>
            </div>
            <div class="stat-item">
              <span class="stat-item__value" id="stat-focus-score">80</span>
              <span class="stat-item__label">Focus Score</span>
            </div>
          </div>
        </div>

        <!-- Current Session Timer -->
        <div class="card timer-card card--glow">
          <p class="timer-card__label">Focus Timer</p>
          <p class="timer-card__display" aria-label="Timer display">25:00</p>
          <div class="timer-card__actions">
            <button id="btn-timer-start" class="btn btn--primary" type="button">Start</button>
            <button id="btn-timer-stop" class="btn btn--ghost" type="button">Stop</button>
          </div>
        </div>

        <!-- Quick Actions: Pomodoro Presets -->
        <div class="preset-group">
          <p class="section-label">Pomodoro Presets</p>
          <div class="preset-group__buttons">
            <button class="btn btn--pill is-active" type="button">25 / 5</button>
            <button class="btn btn--pill" type="button">50 / 10</button>
            <button class="btn btn--pill" type="button">90 / 20</button>
          </div>
        </div>

        <!-- Quick Actions: Quick Timers -->
        <div class="preset-group">
          <p class="section-label">Quick Timer</p>
          <div class="quick-timers">
            <button class="btn btn--ghost" type="button">1 Hour</button>
            <button class="btn btn--ghost" type="button">2 Hours</button>
            <button class="btn btn--ghost" type="button">4 Hours</button>
          </div>
        </div>

        <!-- Navigation Actions -->
        <div class="popup-nav-actions">
          <button id="btn-open-dashboard" class="btn btn--secondary btn--icon-left" type="button">
            <span class="btn__icon" data-icon="reports"></span>
            Open Dashboard
          </button>
          <button id="btn-open-settings" class="btn btn--ghost btn--icon-left" type="button">
            <span class="btn__icon" data-icon="settings"></span>
            Settings
          </button>
        </div>

        <!-- Motivational Quote -->
        <div class="card quote-card">
          <p class="quote-card__text">Keep going.<br>Every hour compounds.</p>
          <p class="quote-card__author">— Timify</p>
        </div>

      </section>

    </main>

  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
